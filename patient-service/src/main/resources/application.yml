spring:
  application:
    name: patientservice
  profiles:
    active: dev

server:
  port: 4000

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true
    operations-sorter: method

logging:
  level:
    root: info
    com.pm.patientservice: debug